version: '3.8'

services:
  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=waverx
      - POSTGRES_DB=climatewaver
      - POSTGRES_PASSWORD=waverx_pass
    ports:
      - 5432:5432
    container_name: climatewavers-db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2
    restart: always
    ports:
      - "6379:6379"
    container_name: climatewavers-redis
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    ports:
      - "5672:5672"
      - "15672:15672"
    container_name: climatewavers-rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
    name: "climatewavers_postgres_data"
  redis_data:
    name: "climatewavers_redis_data"
  rabbitmq_data:
    name: "climatewavers_rabbitmq_data"
